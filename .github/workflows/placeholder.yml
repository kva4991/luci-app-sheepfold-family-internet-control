name: Validate Sheepfold

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - editsByClaude

permissions:
  contents: read

jobs:
  shell-and-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install JavaScript tooling
        run: npm ci

      - name: Verify POSIX lock test dependency
        run: |
          command -v flock
          flock --version

      - name: Run impacted quality checks
        shell: bash
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$PULL_REQUEST_BASE"
          if [ -z "$base" ]; then
            base="$PUSH_BASE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)"
          fi
          node scripts/runQualityChecks.mjs --git "$base" --skip-android --strict

      - name: Validate OpenWrt shell syntax
        shell: bash
        run: |
          set -euo pipefail
          test -x install.sh
          sh -n install.sh
          package_root="package/luci-app-sheepfold-family-internet-control/root"
          find "$package_root/usr/libexec/sheepfold" \
            -type f -print0 | xargs -0 -n1 sh -n
          find "$package_root/usr/share/sheepfold/router-profiles" \
            -type f \( -name apply-mode -o -name install -o -name uninstall \) \
            -print0 | xargs -0 -n1 sh -n
          find "$package_root/etc/hotplug.d" -type f -print0 | xargs -0 -n1 sh -n
          sh -n "$package_root/www/cgi-bin/sheepfold-api"
          sh -n "$package_root/www/.well-known/sheepfold.json.sh"
          sh -n "$package_root/etc/init.d/sheepfold"

      - name: Validate optional ucode mDNS collector
        shell: bash
        run: |
          set -euo pipefail
          root="package/luci-app-sheepfold-family-internet-control/root"
          wrapper="$root/usr/libexec/sheepfold/sheepfold-device-mdns"
          source="$root/usr/share/sheepfold/device-mdns.uc"
          grep -q '^#!/bin/sh$' "$wrapper"
          grep -q 'ucode "\$UCODE_SOURCE"' "$wrapper"
          grep -q 'ubus.call("umdns", "browse"' "$source"
          grep -q 'ubus.call("umdns", "hosts"' "$source"

      - name: Validate runtime hardening invariants
        shell: bash
        run: |
          set -euo pipefail
          package_root="package/luci-app-sheepfold-family-internet-control/root"
          sh "$package_root/usr/libexec/sheepfold/sheepfold-runtime-hardening" "$package_root"

      - name: Smoke-test device classifier contract
        shell: bash
        run: |
          set -euo pipefail
          classifier="package/luci-app-sheepfold-family-internet-control/root/usr/libexec/sheepfold/sheepfold-device-classifier"
          # Подробные правила классификации проверяет deviceDetectorSafety.test.mjs.
          # Здесь оставлен только устойчивый контракт shell-утилиты, чтобы YAML не
          # дублировал меняющиеся пороги и не расходился с единственным источником истины.
          openwrt="$(sh "$classifier" "OpenWrt" "" "" "" "00:11:22:33:44:55")"
          test "$(printf '%s' "$openwrt" | awk -F '\t' '{ print NF }')" = "11"
          test "$(printf '%s' "$openwrt" | cut -f1)" = "router"
          test -z "$(printf '%s' "$openwrt" | cut -f3)"
          test "$(printf '%s' "$openwrt" | cut -f8)" = "1"
